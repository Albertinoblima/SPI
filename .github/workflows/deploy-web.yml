name: Deploy Web - Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force production deploy'
        required: false
        default: false
        type: boolean

jobs:
  quality-gate:
    name: Quality Gate (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck - Web
        run: npx turbo run typecheck --filter=web

      - name: Lint - Web
        run: npx turbo run lint --filter=web
        continue-on-error: true   # Não bloqueia o deploy por enquanto

  deploy-production:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: quality-gate
    # Só executa em pushes na main ou quando forçado manualmente
    if: github.event_name == 'push' || github.event.inputs.force == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          # Não definimos working-directory aqui porque o Root Directory já está configurado no projeto da Vercel
