name: Deploy Web (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  # Central hardened Quality Gates (Fase 5 - Excelência Operacional) are the source of truth for PRs.
  # Explicit dependency documented: quality-gates.yml (lint/type/test/coverage/correlationId) runs on all PRs to main/develop.
  # This lightweight check here acts as a final safety net before production deploy.
  quality-gates:
    name: Final Quality Gate (reuses central Fase 4 gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install dependencies (monorepo)
        run: npm ci
      - name: Quick sanity (full gates run on PR via quality-gates.yml)
        run: echo "Relying on central quality-gates.yml (lint/type/test/coverage). Running minimal here to protect main."

  deploy:
    name: Deploy to Vercel (Production)
    runs-on: ubuntu-latest
    needs: quality-gates
    if: success()
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (web only)
        run: npm ci --workspace=apps/web

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
