name: Apply Supabase Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-supabase-migrations.yml'
  workflow_dispatch:
    # Permite execução manual via GitHub UI (Actions tab)

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 (future-proofing)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-migrations:
    name: Apply pending Supabase migrations
    runs-on: ubuntu-latest

    # Só executa em pushes para main (produção) ou manual.
    # Em develop/PRs apenas o sql-lint.yml roda (mais seguro).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    env:
      SUPABASE_PROJECT_REF: icnclqtwtcbrmuxpujwb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI (direct binary - avoids Node 20 deprecation)
        run: |
          echo "Instalando Supabase CLI..."
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin
          supabase --version
          echo "Supabase CLI instalado com sucesso."

      - name: Validate Supabase Access Token
        run: |
          echo "Validando credenciais do Supabase..."
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::O secret SUPABASE_ACCESS_TOKEN não está configurado!"
            echo ""
            echo "→ Crie o secret em: https://github.com/Albertinoblima/SPI/settings/secrets/actions"
            echo "→ Gere o token em: https://supabase.com/dashboard/account/tokens"
            echo "→ Instruções: https://github.com/Albertinoblima/SPI/blob/main/docs/deployment.md#migrações-de-banco-via-github-novo-fluxo"
            exit 1
          fi
          echo "✅ Token presente (comprimento: $(echo -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" | wc -c) caracteres)"
          echo "Projeto: $SUPABASE_PROJECT_REF"

      - name: Check pending migrations (dry run)
        continue-on-error: true
        run: |
          echo "=== Migrations pendentes no projeto $SUPABASE_PROJECT_REF ==="
          supabase migration list --project-ref "$SUPABASE_PROJECT_REF" 2>&1 || echo "⚠️ Não foi possível listar (verifique permissões do token)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to linked Supabase project
        id: push
        run: |
          echo "Aplicando migrations no projeto $SUPABASE_PROJECT_REF..."
          if supabase db push --yes --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "✅ Migrations aplicadas com sucesso."
          else
            echo "::error::Falha ao aplicar migrations com 'supabase db push --yes'"
            echo ""
            echo "Possíveis causas:"
            echo "  - Token sem permissão suficiente (precisa de acesso de escrita no projeto)"
            echo "  - Conflito de schema / migration já aplicada manualmente"
            echo "  - Erro de sintaxe na migration"
            echo ""
            echo "Dica: rode localmente 'supabase db push --dry-run' para ver o diff"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success notification
        if: success()
        run: |
          echo "✅ Workflow concluído com sucesso!"
          echo "Projeto: icnclqtwtcbrmuxpujwb"
