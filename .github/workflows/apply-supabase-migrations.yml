name: Apply Supabase Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-supabase-migrations.yml'
  workflow_dispatch:
    # Permite execução manual via GitHub UI (Actions tab)

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 to avoid deprecation warnings (actions/checkout, supabase/setup-cli)
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply-migrations:
    name: Apply pending Supabase migrations
    runs-on: ubuntu-latest

    # Só executa em pushes para main (produção) ou manual.
    # Em develop/PRs apenas o sql-lint.yml roda (mais seguro).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase Access Token
        run: |
          echo "Validando credenciais do Supabase..."
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::O secret SUPABASE_ACCESS_TOKEN não está configurado!"
            echo "Crie o secret em: https://github.com/Albertinoblima/SPI/settings/secrets/actions"
            echo "Instruções completas: https://github.com/Albertinoblima/SPI/blob/main/docs/deployment.md#migrações-de-banco-via-github-novo-fluxo"
            exit 1
          fi
          echo "Token presente (comprimento: $(echo -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" | wc -c) caracteres)"
          supabase --version

      - name: Check pending migrations (dry run)
        continue-on-error: true
        run: |
          echo "=== Migrations pendentes no projeto icnclqtwtcbrmuxpujwb ==="
          supabase migration list 2>&1 || echo "⚠️ Não foi possível listar migrations (pode ser problema de permissão do token)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to linked Supabase project
        run: |
          echo "Aplicando migrations pendentes no projeto Supabase (icnclqtwtcbrmuxpujwb)..."
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success notification
        if: success()
        run: |
          echo "✅ Migrations aplicadas com sucesso!"
          echo "Projeto: icnclqtwtcbrmuxpujwb"
