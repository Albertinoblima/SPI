name: Apply Supabase Migrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/apply-supabase-migrations.yml'
  workflow_dispatch:
    # Permite execução manual via GitHub UI (Actions tab)

permissions:
  contents: read

jobs:
  apply-migrations:
    name: Apply pending Supabase migrations
    runs-on: ubuntu-latest

    # Só executa em pushes para main (produção) ou manual.
    # Em develop/PRs apenas o sql-lint.yml roda (mais seguro).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check pending migrations (dry run)
        run: |
          echo "=== Migrations pendentes ==="
          supabase migration list --debug || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to linked Supabase project
        run: |
          echo "Aplicando migrations pendentes no projeto Supabase (icnclqtwtcbrmuxpujwb)..."
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Success notification
        if: success()
        run: |
          echo "✅ Migrations aplicadas com sucesso!"
          echo "Projeto: icnclqtwtcbrmuxpujwb"
